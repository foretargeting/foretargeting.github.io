    <rect x="18.9" y="19" width="4.4" height="12" rx="2.2"/><rect x="18.9" y="9.5" width="4.4" height="7.8" rx="2.2"/>
    <rect x="24.6" y="20.5" width="4.4" height="10.5" rx="2.2"/><rect x="24.6" y="11.5" width="4.4" height="7.4" rx="2.2"/>
    <rect x="30.1" y="24" width="4" height="7.5" rx="2"/><rect x="30.1" y="16.5" width="4" height="6" rx="2"/>
